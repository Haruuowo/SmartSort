name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller filetype pywebview pyyaml pythonnet

      - name: Build Executable
        run: |
          python -m PyInstaller --clean -y SmartSort.spec

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartSort.exe
          name: SmartSort ${{ github.ref_name }}
          body: |
            ## SmartSort ${{ github.ref_name }} Release 🎉
            
            - **C-Level Fast Win32 Drive Scanner**: Ultra-fast multi-gigabyte scanning across 100+ GB drives (`C:\`, `D:\`) with 12-thread parallelism.
            - **Non-Blocking Multithreaded Engine**: Powered by `ThreadingHTTPServer` so the app interface never freezes.
            - **Modern Slate Dark UI**: Sleek Linear/Raycast dark theme with live activity feed, subfolder storage breakdown, and dry-run preview.
            - **Silent Folder Selection**: Native dialogs launch silently without background console popups.
            
            ### Download
            Download `SmartSort.exe` below and double-click to launch!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
