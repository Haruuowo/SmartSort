name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install customtkinter darkdetect pyinstaller filetype

      - name: Build Executable
        run: |
          python -m PyInstaller --name SmartSort --onefile --windowed --add-data "config;config" --add-data "smartsort;smartsort" --hidden-import filetype --hidden-import PIL --hidden-import yaml --hidden-import customtkinter --hidden-import darkdetect --hidden-import smartsort --hidden-import smartsort.classifier --hidden-import smartsort.rules --hidden-import smartsort.history --hidden-import smartsort.dedupe --hidden-import smartsort.watcher --collect-all filetype --collect-all customtkinter --clean -y tui.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartSort.exe
          name: SmartSort v1.0.0
          body: |
            ## SmartSort v1.0.0 Release 🎉
            
            - **Intelligent File Organization**: Sorts audio, documents, installers, images, videos, code, and design files automatically.
            - **Duplicate Handling**: Automatically moves duplicate files to a dedicated `Duplicates` folder.
            - **Sleek Terminal GUI**: Built with CustomTkinter for a clean terminal-style interface with direct folder selection.
            - **Undo System**: Easily revert file moves.
            
            ### Download
            Download `SmartSort.exe` below and double-click to launch!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
