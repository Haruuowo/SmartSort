<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SmartSort organizes your folders into tidy categories with a preview first and one-click undo.">
  <title>SmartSort</title>
  <link rel="icon" type="image/png" href="SS_1.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <img src="SS_1.png" alt="" class="brand-logo" width="30" height="30">
        <div class="brand-text">
          <span class="brand-name">SmartSort</span>
          <span class="brand-sub">File organizer</span>
        </div>
      </div>

      <nav class="nav" id="mainNav">
        <button class="nav-item" data-view="overview" id="navOverview">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Overview</span>
        </button>
        <button class="nav-item" data-view="organize" id="navOrganize">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m9 13 2 2 4-4"/></svg>
          <span>Organize</span>
        </button>
        <button class="nav-item" data-view="history" id="navHistory">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
          <span>History</span>
        </button>
        <button class="nav-item" data-view="rules" id="navRules">
          <svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="17" cy="6" r="2"/><circle cx="14" cy="18" r="2"/></svg>
          <span>Rules</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-view="help" id="navHelp">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.7c0 1.8-2.4 2.3-2.4 3.8"/><path d="M12 17h.01"/></svg>
          <span>Help</span>
        </button>
        <div class="version" id="appVersion">SmartSort</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="folder-bar" id="folderBar" title="">
          <div class="folder-icon">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </div>
          <div class="folder-text">
            <span class="folder-name" id="folderName">No folder selected</span>
            <span class="folder-path" id="folderPath">Choose a folder to scan and organize</span>
          </div>
          <button class="icon-btn hidden" id="revealFolderBtn" title="Open in File Explorer" aria-label="Open in File Explorer">
            <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/></svg>
          </button>
        </div>
        <button class="btn btn-secondary" id="browseBtn" title="Choose folder (Ctrl+O)">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
          <span>Choose folder</span>
        </button>
      </header>

      <section class="page" id="page" aria-live="polite"></section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <div class="context-menu hidden" id="contextMenu" role="menu">
    <div class="context-title" id="contextTitle"></div>
    <button class="context-item" data-menu="reveal" id="menuReveal">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Show in File Explorer
    </button>
    <button class="context-item" data-menu="copy" id="menuCopy">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
      Copy path
    </button>
    <div class="context-sep"></div>
    <button class="context-item danger" data-menu="delete" id="menuDelete">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      Move to Recycle Bin
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
